# F2.7 acceptance drop-in — routes /api/estun/program/run through the
# ROS2 s10_140_executor (Pilz PTP/LIN + JTC) instead of the legacy
# Lua-push pipeline. See addendum-54 (2026-08-31 F2.7 first-run
# acceptance).
#
# Install:
#   sudo mkdir -p /etc/systemd/system/roboai-dashboard.service.d
#   sudo cp \
#     ~/cobot_ws/src/cobot_bringup/systemd/roboai-dashboard.service.d/f27-ros2-executor.conf \
#     /etc/systemd/system/roboai-dashboard.service.d/
#   sudo systemctl daemon-reload
#   sudo systemctl restart roboai-dashboard
#
# Verify:
#   curl -s http://127.0.0.1:8080/api/provenance | jq .run_backend
#   → "ros2_executor"
#
# Revert:
#   sudo rm /etc/systemd/system/roboai-dashboard.service.d/f27-ros2-executor.conf
#   sudo systemctl daemon-reload && sudo systemctl restart roboai-dashboard
#
# Preconditions for USE (not for installing the drop-in itself):
#   - s10_140_executor node must be running. Bring up via OPERATIONS
#     §1: `ros2 launch cod_bringup s10_140_cri_ros2_control.launch.py
#     use_mock:=false` (and any launch that also spawns
#     s10_140_executor.executor_node).
#   - Arm must be in the mode the executor requires (default REMOTE,
#     param `required_mode:=2`).
#
# The drop-in does NOT block. If the executor isn't up, the endpoint
# returns 503 executor_no_subscriber with a specific reason so the
# operator sees WHY the run couldn't dispatch.

[Service]
Environment=RUN_BACKEND=ros2_executor
