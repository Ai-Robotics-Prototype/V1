    M8 CONNECTOR GRID — placeholder (operator artwork pending)
  </text>
  <!-- 4 rows × 5 cols grid, ids aligned with hookup_map.json coordinates.
       Real panel photo replaces this SVG; SVG highlight overlay from
       the wizard keeps positioning correct because it uses x_pct/y_pct
       fractions of the panel image. -->
  <g stroke="#374151" fill="#1F2937" stroke-width="2">
    <!-- Row 0: IN1..IN5 (y_pct 15 → y=60) -->
    <circle cx="50"  cy="60"  r="18"/>
    <circle cx="140" cy="60"  r="18"/>
    <circle cx="230" cy="60"  r="18"/>
    <circle cx="320" cy="60"  r="18"/>
    <circle cx="410" cy="60"  r="18"/>
    <!-- Row 1: IN6..IN10 (y_pct 37 → y=148) -->
    <circle cx="50"  cy="148" r="18"/>
    <circle cx="140" cy="148" r="18"/>
    <circle cx="230" cy="148" r="18"/>
    <circle cx="320" cy="148" r="18"/>
    <circle cx="410" cy="148" r="18"/>
    <!-- Row 2: OUT1..OUT5 (y_pct 62 → y=248) -->
    <circle cx="50"  cy="248" r="18"/>
    <circle cx="140" cy="248" r="18"/>
    <circle cx="230" cy="248" r="18"/>
    <circle cx="320" cy="248" r="18"/>
    <circle cx="410" cy="248" r="18"/>
    <!-- Row 3: OUT6..OUT10 (y_pct 84 → y=336) -->
