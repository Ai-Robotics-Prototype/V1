  <g fill="#94A3B8" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="50"  y="63">IN1</text>
    <text x="140" y="63">IN2</text>
    <text x="230" y="63">IN3</text>
    <text x="320" y="63">IN4</text>
    <text x="410" y="63">IN5</text>
    <text x="50"  y="151">IN6</text>
    <text x="140" y="151">IN7</text>
    <text x="230" y="151">IN8</text>
    <text x="320" y="151">IN9</text>
    <text x="410" y="151">IN10</text>
    <text x="50"  y="251">OUT1</text>
