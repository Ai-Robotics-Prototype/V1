      headline} triple where:
        * title / detail  — operator-language sentences: what
                            happened + what to do. Never carry
                            technical tokens (codegen, HTTP
                            codes, driver reject fragments,
                            firmware bug citations, sha hashes).
                            The BANNED_OPERATOR_TOKENS list is
                            enforced by test_load_outcome pinned
                            tests.
        * technicalDetail — the raw wire reason, hidden behind a
                            "Details" toggle in the modal or
                            demoted to a details section in the
                            toast.

      Fork rule: no operator-facing render site may concatenate
      `outcome.reason || body.error || HTTP status` into a
      user-visible string. Every site imports namedLoadError or
      namedSpeedRefusal and renders the structured result. The
      three canonical call sites are the Run modal, the
      Monitor Restart-refused toast, and the Monitor Speed-
      change-refused toast — all pinned by
      test_operator_refusal_copy.py.
