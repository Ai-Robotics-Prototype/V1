      ones:
        * dashboard `addToast` (frontend → POST /api/event_log/append)
        * driver `_reject` frames on /estun/rejected (subscribed in
          the dashboard)
        * driver stopJog causes (fired on last_stop_ts advance in
          _on_estun_status)
        * teach-session lifecycle events (create/end/expire/take-over)
        * deploy watcher phases from /opt/cobot/deploy_log.jsonl
        * validator/lint findings at refusal

