  # 25. Self-collision guard kill switch (2026-08-06 operator
  # directive). SINGLE AUTHORITATIVE runtime kill switch for the
  # entire self-collision + ground-plane capsule guard, ALL tiers
  # (40 mm warn, 15 mm hard stop, ground plane, cart-mode escape
  # gate, pre-flight jog check).
  - id: collision_guard_kill_switch
    description: >
      One switch, one truth: the driver's runtime flag
      `_coll_guard_active` gates every guard call site. When
      False, no clearance-related message is emitted anywhere in
      the stack — the tick evaluator, the pre-flight jog check,
      the cart-mode start guard, and the posture-time min-
      clearance publisher all no-op. `collision_enabled`
      parameter is the boot default (also False per this
      directive). Runtime toggle via /robot/collision_guard_set
      (Bool); dashboard exposes GET/POST /api/collision_guard.

      Fork rule: any second implementation of "is the collision
      guard active" — a duplicate flag, a bypass path that
      evaluates the coll_model without checking
      `_coll_guard_active`, a frontend component that renders
      clearance without gating on `robot.collision_enabled` — is
      a fork. Adding a new guard USE site to the driver requires
      including `and self._coll_guard_active` in the same
      predicate (or an equivalent early-return); the pinned
      tests count gates and refuse a merge that adds a use site
      without one.

      Event log is the operator's audit trail: every transition
      of `collision_enabled` (boot observation, runtime toggle,
      status-blob change) emits an event_log entry with severity
      warning on OFF, info on ON.

      SAFETY (surfaced by the doctrine, not gated by the code):
      with the guard OFF nothing in software prevents a link-on-
      link or link-on-table crash. Operator's explicit informed
      choice per the 2026-08-06 directive.
    canonical:
      python:
        module: estun_driver.estun_driver_node
        functions: []
        note: >
          `_coll_guard_active` seeded from the `collision_enabled`
          param. `_on_collision_guard_set` handles the runtime
          topic. Every _coll_model USE site includes
          `and self._coll_guard_active`.
      dashboard:
        module: cobot_dashboard.dashboard_server
        functions: [api_collision_guard_get, api_collision_guard_set,
                    _publish_collision_guard_set]
      frontend:
        path: src/cobot_dashboard/frontend/src/layouts/ConfigureLayout.jsx
        exports: [default]
        note: >
          SelfCollisionGuardSection is the single UI surface for
          the kill switch. HardStopToast gates on
          robot.collision_enabled so a stale wire message never
          surfaces after a toggle.
    forbidden:
      # No new component may render clearance without gating on
      # robot.collision_enabled. Match the two most common
      # clearance-reading patterns.
      - path_glob: src/cobot_dashboard/frontend/src/**/*.{js,jsx}
        patterns:
          - "robot\\?\\.collision_min_mm"
        path_exempt:
          - src/cobot_dashboard/frontend/src/layouts/View3DLayout.jsx
          - src/cobot_dashboard/frontend/src/components/StandaloneRobot.jsx
          - src/cobot_dashboard/frontend/src/components/HardStopToast.jsx
          - src/cobot_dashboard/frontend/src/components/ObstacleEscapeModal.jsx
          - src/cobot_dashboard/frontend/src/components/SelfCollisionWarnBanner.jsx
          - src/cobot_dashboard/frontend/src/lib/collisionPresentation.js
          - '**/*.test.js'
          - '**/*.test.jsx'
    known_debt: []


# ── Heuristic sweep ─────────────────────────────────────────────────
#
# For domain math the registry hasn't listed explicitly. Runs on every
# frontend JS/JSX file. Any hit surfaces as a WARNING (review-required)
# — not a gate failure — because the false-positive rate is real
# (general geometry in orient.js / IKGizmo.jsx is legitimate). The
# reviewer either:
#
#   * adds a real registry entry (patterns tuned, path_exempt filled),
#   * or moves the site to known_debt with an owner and reason.
#
# Never leave a heuristic hit unresolved for more than one commit —
# the whole point is to force a decision.

heuristic_sweep:
  frontend_numeric_math_on_domain_objects:
    description: >
      Frontend code doing vector/pose math on domain identifiers
      (corner_tcp, taught_joints, jp, cp, tcp, joint_positions,
      part_tcp) is suspicious. Backend owns these numerics.
    path_glob: src/cobot_dashboard/frontend/src/**/*.{js,jsx}
    # A file matches if it references at least one domain identifier
    # AND at least one math primitive from the list below.
    domain_identifiers:
      - 'corner[123]_tcp'
      - 'corner_a_tcp'
      - 'point_[bc]_tcp'
      - 'part_tcp'
      - 'taught_joints'
      - 'taught_tcp'
      - "'jp'|\"jp\""
      - "'cp'|\"cp\""
    math_primitives:
      - 'Math\.acos'
      - 'Math\.hypot'
      - 'Math\.sqrt'
      - '\bcross\s*\('
      - '\bdot\s*\('
      - '\bnorm\s*\('
    # Files exempt from the sweep — the client that only POSTs to the
    # backend validator carries these identifiers by necessity but
    # does no math.
    path_exempt:
      - src/cobot_dashboard/frontend/src/lib/palletFrameValidator.js
      - src/cobot_dashboard/frontend/src/lib/palletFrameValidator.test.js
      - '**/*.test.js'
      - '**/*.pinned.test.js'
    # Files that CURRENTLY carry legitimate frontend math on other
    # domain objects (Isaac IK gizmo, wrist orient) — grandfathered.
    known_ok:
      - path: src/cobot_dashboard/frontend/src/lib/orient.js
        why: >
          Wrist orientation math for the operator-visible J5 sanity
          check — not pallet-frame, not TCP calc. General SE(3) math
          that the backend does not own separately.
        owner: robot-driver
      - path: src/cobot_dashboard/frontend/src/components/IKGizmo.jsx
        why: >
          3D-viewer IK preview gizmo — client-side visualization
          only, no operator verdict, no motion decision.
        owner: perception-ui
