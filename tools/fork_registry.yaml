      day/{YYYYMMDD}. Downloads (JSONL, CSV, 7-day zip) serve
      through /api/event_log/download/.

      Fork rule: NO component writes its own error/event log file
      elsewhere. Any file matching `*event*log*.jsonl` or a per-
      component .log file that duplicates the event stream is a fork.
      Cross-source persistence (breadcrumbs, joint recorder,
      recovery_events.jsonl) has DIFFERENT semantics — those are
      structured domain data, not the operator error log — and are
      grandfathered.
