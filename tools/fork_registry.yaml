  # 22. Page-context persistence (2026-08-05 refresh-loss P0).
  - id: page_context_persistence
    description: >
      The Jetson owns "which program is open on this device" +
      "which tab is active". Refreshing the tablet MUST NOT lose
      the loaded program. Same doctrine as teach-session record-
      through: server is truth, UIs are views.

      Canonical store: cobot_dashboard.ui_context (one JSON per
      device_id under /opt/cobot/ui_context/). Endpoints:
        GET  /api/ui_context/{device_id}   — read
        POST /api/ui_context/{device_id}   — merge patch
        POST /api/teach_session/{prog_id}/edit — persist a whole-
             program structural edit so refresh preserves unsaved
             changes ("edit-through", extends record-through past
             pose-only teaches to full program edits).

      Fork rule: NO browser localStorage / sessionStorage / cookie
      is allowed to persist page state — same-store hazard as the
      pre-fix localStorage("current_program_id") string that broke
      on refresh when the program had been renamed or deleted
      server-side. Session-scoped state (URL query, in-memory
      Zustand) is fine; anything that survives a reload must round-
      trip through the ui_context endpoints.

      EXCEPTION (2026-08-05 identity root-cause fix): device
      IDENTITY (not state) is explicitly whitelisted. The
      'roboai-device-id' localStorage key holds a stable
      per-machine UUID — one physical device, one identity, all
      tabs share it. This is the ONE thing browser storage owns
      canonically; the server never mints it and cannot,
      because the server can't tell "same device new tab" from
      "different device" without a stable client-anchored id.
      Legacy sessionStorage key 'roboai-teach-device-id' is
      migrated once on read then removed.
    canonical:
      python:
        module: cobot_dashboard.ui_context
        functions: [get, set, clear, list_all]
      dashboard:
        module: cobot_dashboard.dashboard_server
        functions: [api_ui_context_get, api_ui_context_set,
                    api_teach_session_edit]
      frontend:
        path: src/cobot_dashboard/frontend/src/store/useStore.js
        exports: [restoreOpenProgramOnMount, rememberOpenProgram,
                  editThroughProgram]
    forbidden:
      # No browser-storage persistence of page state.
      - path_glob: src/cobot_dashboard/frontend/src/**/*.{js,jsx}
        patterns:
          - "localStorage\\.(set|get)Item\\(\\s*['\"](current_program_id|open_program_id|active_tab|last_program|programId|last_open_program)"
          - "sessionStorage\\.(set|get)Item\\(\\s*['\"](current_program_id|open_program_id|active_tab|last_program|programId|last_open_program)"
        path_exempt:
          - '**/*.test.js'
          - '**/*.test.jsx'
    known_debt: []

  # 23. Disk watchdog + retention caps (2026-08-05 record-endpoint
  # ENOSPC P0).
  - id: disk_watchdog
    description: >
      ONE module owns "how much space is free on /opt/cobot", the
      thresholds for warning/critical/dead, and the enforced
      per-directory retention caps. Motivated by the 2026-08-05
      P0 where the record endpoint crashed on ENOSPC because
      three log domains (driver ws logs, joint_history, event_log)
      grew unbounded.

      Directory caps (mirrored numerics — the canonical writer for
      each domain still owns its own prune; disk_watchdog re-runs
      the sweep at boot + every 60 s so no domain-writer bug
      leaves us stranded):
        /opt/cobot/logs           2 GB
        /opt/cobot/joint_history  2 GB
        /opt/cobot/event_log      500 MB

      Thresholds (free bytes on the partition):
        WARN     < 2 GB   — footer widget amber; banner suggestion
        CRITICAL < 500 MB — non-critical writers stop (event log,
                            deploy log tail); critical writers
                            still attempt with 507 on failure
        DEAD     < 50 MB  — critical writers refuse pre-emptively

      Endpoint: GET /api/disk_status.

      Fork rule: NO other module implements its own free-space
      check with different thresholds, and NO module defines its
      own bytes-cap constant for /opt/cobot/logs, /opt/cobot/
      event_log, or /opt/cobot/joint_history outside disk_watchdog
      (the canonical domain writers keep their own prune, but the
      NUMBERS must match disk_watchdog.DIR_CAPS — mirror, don't
      diverge).
    canonical:
      python:
        module: cobot_dashboard.disk_watchdog
        functions: [free_bytes, level, should_write, enforce_all,
                    status, start_watchdog_thread]
      dashboard:
        module: cobot_dashboard.dashboard_server
        functions: [api_disk_status]
      frontend:
        path: src/cobot_dashboard/frontend/src/components/StatusBar.jsx
        exports: [default]
    forbidden:
      # No competing free-space thresholds. `statvfs` calls belong in
      # disk_watchdog; anyone else calling it directly is a fork.
      - path_glob: src/cobot_dashboard/cobot_dashboard/**/*.py
        patterns:
          - "os\\.statvfs\\("
          - "shutil\\.disk_usage\\("
        path_exempt:
          - src/cobot_dashboard/cobot_dashboard/disk_watchdog.py
          - '**/test_*.py'
    known_debt: []

