# tools/fork_registry.yaml — canonical-owner registry (§465 fork-1 lesson,
# 2026-08-04).
#
# ONE FILE, MACHINE-READABLE. Every capability in this workspace that must
# have exactly one implementation is listed here with:
#   * `canonical`   — the module/file/route that owns the implementation
#   * `forbidden`   — where duplicates are refused, by path glob + pattern
#   * `known_debt`  — historically-tolerated duplicate sites, ticketed and
#                     owned
#
# The registry-driven linter (`tools/fork_lint.py`) reads this file. Its
# invariants:
#
#   (a) Every `canonical` block resolves to real code on disk (test:
#       `test_fork_registry_resolves.py`).
#   (b) Every `forbidden` entry whose patterns fire against a matching
#       forbidden path — outside `known_debt` — is a lint failure.
#   (c) A `heuristic_sweep` block scans frontend files for numeric math
#       on domain identifiers even when no exact pattern matches; these
#       are review-required warnings, not gate failures — but every
#       heuristic hit either becomes a registry entry (with a real
#       pattern) OR gets tagged as known_debt with an owner.
#
# When adding a new shared capability: put an entry HERE in the same
# commit that lands the implementation. When killing a fork: move its
# `known_debt` entry to fully-registered status. Do not silently
# suppress a hit — either fix the code, register the pattern, or debt
# the site with a name attached.

# ── Path abbreviations used below ────────────────────────────────────
# FE  = src/cobot_dashboard/frontend/src
# BE  = src/cobot_dashboard/cobot_dashboard
# DRV = src/estun_driver/estun_driver
# PBD = src/programming_by_demonstration/programming_by_demonstration

# ── Registered capabilities ─────────────────────────────────────────

capabilities:

  # 1. Pallet-frame geometry (§465 fork-1 kill, 3ae0760).
  - id: pallet_frame_geometry
    description: >
      Frame math for the 3-corner pallet teach — row/col vectors,
      plane normal, tilt, coincident-corner and near-parallel
      validation. Backend-only via POST /api/pallet/validate_frame.

      2026-08-05 OPERATOR DOCTRINE RULING (canonical semantics):
      Corners 1-3 define the pallet FRAME ONLY (origin at corner 1,
      row axis toward corner 2, column axis toward corner 3, plane
      from all three). Point 4 is the CENTER of slot [1,1]
      (first-part datum). Slot spacing comes EXCLUSIVELY from typed
      pitch values in the palletizing parameters dialog:
        slot[i,j] = datum + (i-1)·pitch_row·row_axis
                          + (j-1)·pitch_col·col_axis
                          + layer·layer_height·plane_normal
      Corner-to-corner distance has NO required relationship to
      pitch. `_effective_pitches` MUST return typed values only.
      `validate_frame` MUST NOT emit `row_pitch_mismatch` or
      `col_pitch_mismatch` findings (retired — see doctrine test
      test_pallet_doctrine_canonical.py). The replacement check is
      the grid-fits-frame test that catches pitch typos without
      false positives on legitimate configs.
    canonical:
      python:
        module: programming_by_demonstration.pallet_geometry
        functions: [compute_frame, validate_frame, measured_pitches]
      route:
        method: POST
        path: /api/pallet/validate_frame
      javascript:
        module: src/cobot_dashboard/frontend/src/lib/palletFrameValidator.js
        exports: [validatePalletFrameServer, findingsBlockingThisRecord]
    forbidden:
      - path_glob: src/cobot_dashboard/frontend/src/**/*.{js,jsx}
        context_sentinel: 'corner[123]_tcp|corner_a_tcp|point_[bc]_tcp|part_tcp'
        patterns:
          - 'plane_normal'
          - 'Math\.acos\s*\(.*dot'
          - 'Math\.abs\s*\(\s*row\s*\[\s*2\s*\]\s*\)\s*/\s*rowLen'
          - 'Math\.abs\s*\(\s*col\s*\[\s*2\s*\]\s*\)\s*/\s*colLen'
          # Any `function validatePalletFrame` in a JS/JSX file
          # outside the async client is the fork returning.
          - 'function\s+validatePalletFrame\s*\('
          - 'export\s+function\s+validatePalletFrame\s*\('
        path_exempt:
          - src/cobot_dashboard/frontend/src/lib/palletFrameValidator.js
          - src/cobot_dashboard/frontend/src/lib/palletFrameValidator.test.js
          - '**/*.test.js'
          - '**/*.pinned.test.js'
    known_debt: []

  # 2. Motion-verb classification (D14 backing invariant).
  - id: motion_verb_catalogue
    description: >
      Which Lua verbs count as motion — the empty-motion gate and the
      arg-arity linter both key on this set. Sourced from the 168-verb
      luaenginelib.json catalogue; any hard-coded list of mov* verbs
      elsewhere is a fork.
    canonical:
      python:
        module: estun_driver.program_ops
        functions: [motion_verbs, has_valid_motion]
      file:
        path: src/estun_driver/estun_driver/luaenginelib.json
        note: 168-verb authoritative catalogue mined from factory UI bundle
    forbidden:
      - path_glob: src/cobot_dashboard/cobot_dashboard/**/*.py
        patterns:
          # A hand-written {movJ, movL, movC, ...} literal in the
          # dashboard is a fork of has_valid_motion / motion_verbs.
          - "\\{['\"]mov[JLCW]"
        path_exempt: []
      - path_glob: src/cobot_dashboard/frontend/src/**/*.{js,jsx}
        patterns:
          # Frontend has no business classifying motion verbs
          # against the catalogue — that belongs to the lint gate.
          - "\\['movJ',\\s*'movL'"
    known_debt: []

  # 3. Program-selection state (rollback fix, 83f9472).
  - id: program_selection_write
    description: >
      Which endpoint writes STATE.robot.program.resident_program_id.
      Only /api/estun/program/run (with push_only:true for a load).
      /api/program/run action:'load' is retired 410.
    canonical:
      python:
        module: cobot_dashboard.dashboard_server
        functions: [api_estun_program_run]
      route:
        method: POST
        path: /api/estun/program/run
      javascript:
        module: src/cobot_dashboard/frontend/src/pages/MonitorDashboard.jsx
        exports: [pushProgramToController]
    forbidden:
      - path_glob: src/cobot_dashboard/frontend/src/**/*.{js,jsx}
        patterns:
          # Legacy action:'load' — retired.
          - "action:\\s*['\"]load['\"]"
      - path_glob: src/cobot_dashboard/cobot_dashboard/**/*.py
        patterns:
          # Only ONE line in the server writes resident_program_id.
          # Any second write site is a fork. This pattern flags an
          # ASSIGNMENT — reads (`... = STATE.get(...)['program']`)
          # don't match.
          - 'resident_program_id["\\]\\s*=\\s*[a-zA-Z_]'
        path_exempt:
          - src/cobot_dashboard/cobot_dashboard/dashboard_server.py
    known_debt: []

  # 4. Load-outcome operator copy (267108a rewrite).
  - id: load_outcome_operator_copy
    description: >
      Named operator-language messages for /api/estun/program/run
      refusals (pending_poses, transport_down, arity_assertion_failed,
      etc). One helper, one BANNED_OPERATOR_TOKENS list.
    canonical:
      javascript:
        module: src/cobot_dashboard/frontend/src/lib/loadOutcome.js
        exports: [namedLoadError, LOAD_OUTCOME_KINDS,
                  BANNED_OPERATOR_TOKENS]
    forbidden:
      - path_glob: src/cobot_dashboard/frontend/src/**/*.{js,jsx}
        patterns:
          # A parallel switch on outcome.kind in another file is a fork.
          - 'switch\s*\(\s*[a-zA-Z_.?]*outcome\.kind'
          - 'if\s*\(\s*[a-zA-Z_.?]*kind\s*===\s*[''"]pending_poses'
        path_exempt:
          - src/cobot_dashboard/frontend/src/lib/loadOutcome.js
          - src/cobot_dashboard/frontend/src/lib/loadOutcome.test.js
          - '**/*.test.js'
    known_debt: []

  # 4a. Arm enable/disable chip control (2026-08-06 operator directive).
  - id: arm_enable_control
    description: >
      ONE compact chip surface shows the arm state (ALARM / ENABLING /
      JOG / READY / DISABLED) and dispatches Enable / Disable via
      sendPowerCommand behind a window.confirm gate. Rendered on the
      3D View (RealArmChrome header) AND the Monitor page (above the
      run controls). Both read the same useStore(`robot.*`) mirror so
      toggling on either surface reflects live in the other.

      DISTINCT from JogControls' internal power banner + confirm
      modal (which handles ALARM/DISABLED banner-driven flow) and
      from AlarmRecoveryModal (which handles guided-recovery). Those
      TWO callers legitimately use sendPowerCommand for their
      respective UX flows; the CHIP style — a compact status +
      window.confirm-gated toggle button — must exist ONLY in
      ArmEnableControl.jsx.
    canonical:
      javascript:
        module: src/cobot_dashboard/frontend/src/components/ArmEnableControl.jsx
        exports: [default]
    forbidden:
      - path_glob: src/cobot_dashboard/frontend/src/**/*.{js,jsx}
        # Only files that dispatch sendPowerCommand are candidates for
        # duplicating the chip; unrelated files that mention window
        # .confirm for other flows are fine.
        context_sentinel: 'sendPowerCommand'
        patterns:
          # The chip's distinguishing signature: window.confirm guarding
          # sendPowerCommand('enable' | 'disable'). JogControls uses a
          # React-state confirm modal (pendingPower), NOT window.confirm.
          # AlarmRecoveryModal has no window.confirm at all — its buttons
          # are the recovery-modal itself.
          - "window\\.confirm\\([^)]*[Ee]nable"
          - "window\\.confirm\\([^)]*[Dd]isable"
        path_exempt:
          - src/cobot_dashboard/frontend/src/components/ArmEnableControl.jsx
    known_debt: []

  # 5. Toast rendering + structured content (267108a).
  - id: toast_rendering
    description: >
      Structured toast API {title, detail, technicalDetail} and its
      single render surface. Callers pass structured objects; the
      ToastContainer renders each field exactly once with technical
      detail behind a Details toggle.
    canonical:
      javascript:
        module: src/cobot_dashboard/frontend/src/components/ToastContainer.jsx
        exports: [Toast, ToastContainer]
    forbidden:
      - path_glob: src/cobot_dashboard/frontend/src/**/*.{js,jsx}
        patterns:
          # Manual concatenation of headline+detail into a single
          # toast string was the pre-267108a duplication class.
          - "addToast\\?\\.\\(\\s*`\\$\\{[a-zA-Z_.]+\\}\\s*—\\s*\\$\\{[a-zA-Z_.]+\\}`"
          - "addToast\\(\\s*`\\$\\{[a-zA-Z_.]+\\}\\s*—\\s*\\$\\{[a-zA-Z_.]+\\}`"
        path_exempt: []
    known_debt: []

  # 6. Run-state derivation (deriveRunState).
  - id: run_state_derivation
    description: >
      Single deriveRunState() maps {safety, robot, task} to the pill
      kind + label. stale_link_down + all other kinds live there.
    canonical:
      javascript:
        module: src/cobot_dashboard/frontend/src/lib/runState.js
        exports: [deriveRunState, isStopButtonEnabled, isStuckStopping,
                  isStateStreamStale]
    forbidden:
      - path_glob: src/cobot_dashboard/frontend/src/**/*.{js,jsx}
        patterns:
          # Parallel state-kind classification is a fork.
          - "kind:\\s*['\"](running|stopping|estop|alarm|stale_link_down)['\"]"
        path_exempt:
          - src/cobot_dashboard/frontend/src/lib/runState.js
          - src/cobot_dashboard/frontend/src/lib/runState.test.js
          - '**/*.test.js'
    known_debt: []

  # 7. Load-must-push contract (a17da6c + 83f9472).
  - id: load_must_push
    description: >
      Program Library click posts /api/estun/program/run push_only=true.
      No frontend caller may post action:'load' anywhere.
    canonical:
      javascript:
        module: src/cobot_dashboard/frontend/src/pages/MonitorDashboard.jsx
        exports: [onSelectProgram, pushProgramToController]
    forbidden:
      - path_glob: src/cobot_dashboard/frontend/src/**/*.{js,jsx}
        patterns:
          - "action:\\s*['\"]load['\"]"
        path_exempt: []
    known_debt: []

  # 8. Pending-pose gate (D14, 60790e8).
  - id: pending_pose_gate
    description: >
      Motion steps with unresolved poses never reach codegen.
      check_program_pending_poses is the ONE resolver.
    canonical:
      python:
        module: estun_driver.program_ops
        functions: [check_program_pending_poses]
    forbidden:
      - path_glob: src/cobot_dashboard/cobot_dashboard/**/*.py
        patterns:
          # A parallel scan of steps checking taught + taught_joints
          # + derived_from without going through the shared resolver
          # is a fork.
          - "taught_joints[\"\\]].{0,20}?len.{0,10}?==\\s*6.{0,80}?derived_from"
        path_exempt:
          - src/cobot_dashboard/cobot_dashboard/dashboard_server.py
    known_debt: []

  # 9. Mov* pose-vector arity (D14, D15).
  - id: mov_arity_gate
    description: >
      Every mov* verb emitted MUST carry a 6-element pose vector.
      D14/D15 matchers in program_ops.py's _KNOWN_BAD_PATTERNS.
    canonical:
      python:
        module: estun_driver.program_ops
        functions: [lint_lua_source, _bad_mov_pose_vector_arity,
                    _bad_setBlender_arg]
    forbidden:
      - path_glob: src/cobot_dashboard/cobot_dashboard/**/*.py
        patterns:
          # A parallel numeric-token count on a mov* emission would
          # be a fork.
          - "movJCoorRel.{0,80}?count.{0,20}?==\\s*6"
        path_exempt: []
    known_debt: []

  # 10. Codegen line-map (D9).
  - id: codegen_line_map
    description: >
      Line-map JSON is emitted from codegen_lua_from_program and
      sidecar-refreshed on push. One authoritative producer.
    canonical:
      python:
        module: estun_driver.program_ops
        functions: [codegen_lua_from_program]
      file:
        path: /opt/cobot/programs/*.line_map.json
        note: sidecar written by dashboard_server._compute_and_save_line_map
    forbidden:
      - path_glob: src/cobot_dashboard/frontend/src/**/*.{js,jsx}
        patterns:
          # Frontend computes line-map → step-index via useLineMap,
          # not by re-parsing Lua text. Frame-parsing Lua on the
          # client would be a fork of codegen's own map. Grouped
          # alternation so `movJ(name)` in a toast doesn't false-
          # positive — the fork signature is a mov* MATCH followed
          # by line-number extraction.
          - "(?:movJ|movL)\\s*\\([^)]*\\)[^\\n]{0,120}line[Nn]umber"
    known_debt: []

  # 11. Pallet frame status (taught-state).
  - id: pallet_frame_status
    description: >
      One resolver — palletFrameStatus in programTruth.js — for the
      corner1/corner2/corner3/part booleans + migratedFromV1 flag.
      Editor, wizard, findings, teaching-debt all read this.
    canonical:
      javascript:
        module: src/cobot_dashboard/frontend/src/lib/programTruth.js
        exports: [palletFrameStatus, firstUntaughtPalletRole,
                  PALLET_ROLE_ORDER]
    forbidden:
      - path_glob: src/cobot_dashboard/frontend/src/**/*.{js,jsx}
        patterns:
          # Any parallel taught-booleans derivation from
          # place.corner*_tcp checks is a fork.
          - "corner1_tcp\\s*&&\\s*[a-zA-Z_.]*corner2_tcp\\s*&&\\s*[a-zA-Z_.]*corner3_tcp"
        path_exempt:
          - src/cobot_dashboard/frontend/src/lib/programTruth.js
          - '**/*.test.js'
    known_debt: []

  # 12. Teach-session state (record-through, 2026-08-04).
  - id: teach_session_state
    description: >
      Mid-teach pose state (recorded corners, taught step joints
      not yet promoted to disk) lives ONLY on the Jetson at
      /opt/cobot/teach_sessions/{pid}.draft.json. STATE
      ['teach_sessions'] mirrors every draft; the WS state
      broadcast carries them; every Record Position on every
      teach surface goes through POST
      /api/teach_session/{pid}/record — Zustand is a cache of
      server truth, never the owner. No client-side pose
      persistence (localStorage, Zustand persist whitelist,
      per-component copies).
    canonical:
      python:
        module: cobot_dashboard.dashboard_server
        functions: [_teach_read_draft, _teach_write_draft,
                    _teach_publish_to_state,
                    _apply_draft_poses_to_program]
      route:
        method: POST
        path: /api/teach_session/{prog_id}/record
      javascript:
        module: src/cobot_dashboard/frontend/src/store/useStore.js
        exports: [recordTeachPose, startTeachSession,
                  takeOverTeachSession, cancelTeachSession,
                  promoteTeachSession]
    forbidden:
      - path_glob: src/cobot_dashboard/frontend/src/**/*.{js,jsx}
        patterns:
          # localStorage on pose data anywhere is banned — the
          # server is authoritative.
          - "localStorage\\.setItem\\([^,)]*['\"](taught|corner_tcp|corner1_tcp|corner2_tcp|corner3_tcp|part_tcp|currentProgram)['\"]"
          # Reintroducing currentProgram to the Zustand persist
          # whitelist is a fork of teach_session_state (draft
          # poses land in currentProgram; persist mirrors them
          # to localStorage). The specific string 'currentProgram'
          # inside a `partialize` return is the fork signature.
          - "partialize:.*currentProgram: state\\.currentProgram"
        path_exempt:
          - '**/*.test.js'
          - '**/*.pinned.test.js'
    known_debt: []


  # 13. PBD composer (deterministic intent → program).
  - id: pbd_composer
    description: >
      Programming-by-Demonstration intent → program is a PURE
      deterministic function. LLM output is limited to the
      intent JSON (schema-validated). The composer emits steps,
      labels, and verbs from the intent shape alone — never from
      transcript strings, never with wall-clock / random IDs.
    canonical:
      python:
        module: programming_by_demonstration.program_composer
        functions: [compose_program_draft]
    forbidden:
      # A second `def compose_program_draft` anywhere else is a
      # fork by definition — scanned across the whole PBD tree.
      - path_glob: src/programming_by_demonstration/programming_by_demonstration/**/*.py
        patterns:
          - 'def compose_program_draft\('
        path_exempt:
          - src/programming_by_demonstration/programming_by_demonstration/program_composer.py
          - '**/*.test.py'
          - '**/test_*.py'
      # Non-determinism sources INSIDE the composer file itself.
      # Scoped narrowly to program_composer.py so unrelated files
      # (utils.py's demo-id mint, learning_store's file-name mint)
      # can still use uuid/random for their own purposes.
      - path_glob: src/programming_by_demonstration/programming_by_demonstration/program_composer.py
        patterns:
          - 'uuid\.uuid'
          - 'random\.(random|choice|uniform|randint)'
          - 'time\.time\('
          - 'datetime\.now\('
        path_exempt: []
    known_debt: []

  # 14. PBD label vocabulary (fixed strings, single source of truth).
  - id: pbd_label_vocabulary
    description: >
      Every step label the composer emits routes through
      `label_vocabulary.LABEL_FOR_ROLE` (§determinism directive,
      2026-08-04). Inline literal labels in the composer or its
      helpers are a fork. Adding a label = adding a
      LABEL_FOR_ROLE entry in the same commit that emits it.
    canonical:
      python:
        module: programming_by_demonstration.label_vocabulary
        functions: [label_for, check_program_emissions,
                    assert_action_emittable]
    forbidden:
      - path_glob: src/programming_by_demonstration/programming_by_demonstration/**/*.py
        patterns:
          # Any hardcoded top-level LABEL_FOR_ROLE-like dict outside
          # the canonical module is a fork of the vocabulary.
          - "LABEL_FOR_ROLE\\s*=\\s*\\{"
        path_exempt:
          - src/programming_by_demonstration/programming_by_demonstration/label_vocabulary.py
          - '**/test_*.py'
    known_debt: []

  # 15. PBD archetype skeletons.
  - id: pbd_archetype_skeletons
    description: >
      Task archetypes (pick_and_place, sort, machine_tend,
      palletize, depalletize) each have EXACTLY ONE builder
      function in `program_composer.py`. A second `_build_*` for
      the same archetype is a fork.
    canonical:
      python:
        module: programming_by_demonstration.program_composer
        functions: [_build_pick_and_place, _build_sort,
                    _build_machine_tend, _build_palletize]
    forbidden:
      - path_glob: src/programming_by_demonstration/programming_by_demonstration/**/*.py
        patterns:
          # A second `def _build_pick_and_place` (or the other
          # archetypes) anywhere else is a fork.
          - "def _build_(pick_and_place|sort|machine_tend|palletize)\\b"
        path_exempt:
          - src/programming_by_demonstration/programming_by_demonstration/program_composer.py
          - '**/test_*.py'
    known_debt: []

  # 16. Pose unit canon — meters + radians internal; mm/deg at UI +
  #     codegen boundaries only.
  - id: pose_unit_canon
    description: >
      taught_tcp and every pose value transported through the
      workspace are METERS + RADIANS. Matches driver tcp_m,
      state.tcp_pose, record-through draft store, ROS convention,
      and every taught_tcp already on disk. Millimetres +
      degrees exist ONLY at (a) the operator-facing UI render
      layer, and (b) the codegen emit boundary in
      estun_driver.program_ops (which already handles both units
      via magnitude sniffing at lines 1499-1503, 1985-1990).
      Any *_mm-named field assigned from taught_tcp or
      tcp_pose without an explicit *1000.0 conversion in scope
      is a unit lie of the class fixed on 2026-08-04 (325 mm
      distances reported as 0.325 mm and refused as coincident).
    canonical:
      python:
        module: programming_by_demonstration.pallet_geometry
        functions: [validate_frame, compute_slot_offsets,
                    derive_slot_tcps, measured_pitches]
    forbidden:
      - path_glob: src/programming_by_demonstration/programming_by_demonstration/**/*.py
        patterns:
          # A variable named *_mm assigned directly from a
          # taught_tcp or tcp_pose expression, on the same line,
          # without a * 1000 conversion, is the unit-lie
          # signature. Best-effort regex — a targeted single-
          # line check catches the common case (multi-line
          # assignments will slip through, but those are rare
          # enough that a code review catches them).
          - "[a-zA-Z_][a-zA-Z0-9_]*_mm\\s*=\\s*[^\\n]*(?:taught_tcp|tcp_pose)[^\\n*]*$"
        path_exempt:
          # Legacy identifier `distance_mm` in the endpoint's
          # backward-compat fallback lookup, and known
          # boundary-conversion sites where the * 1000 IS
          # applied on the same expression.
          - '**/test_*.py'
      - path_glob: src/cobot_dashboard/cobot_dashboard/**/*.py
        patterns:
          # Same pattern for the dashboard side (endpoints /
          # helpers).
          - "[a-zA-Z_][a-zA-Z0-9_]*_mm\\s*=\\s*[^\\n]*(?:taught_tcp|tcp_pose)[^\\n*]*$"
        path_exempt:
          - '**/test_*.py'
    known_debt:
      - path: src/estun_driver/estun_driver/program_ops.py
        line: 1499
        why: >
          Codegen has intentional magnitude-sniffing (|value|<10
          treated as meters and multiplied by 1000; else assumed
          mm). Legitimate boundary conversion; kept unchanged
          because the wire (Estun Lua mov*Rel cp={x,y,z,...})
          takes mm.
        owner: estun-driver

  # 17. Estun sign inversion (URDF axes).
  - id: estun_axis_sign_inversion
    description: >
      J3 and J5 URDF axes are intentionally sign-inverted vs CAD
      (documented under [[cobot-estun-driver-twin]]). All axis
      sign changes must happen exactly once, inside the driver's
      forward/inverse conversion helpers — do not re-flip
      downstream.
    canonical:
      python:
        module: estun_driver.estun_driver_node
        functions: []
        note: sign inversion lives in _rad_from_deg/_deg_from_rad-adjacent helpers; grep _URDF_SIGN before adding a new caller
    forbidden:
      - path_glob: src/estun_driver/estun_driver/**/*.py
        patterns:
          # Any bare `joints[2] = -joints[2]` or `joints[4] = -joints[4]`
          # outside the canonical helper is a fork.
          - "joints\\s*\\[\\s*[24]\\s*\\]\\s*=\\s*-\\s*joints\\s*\\[\\s*[24]\\s*\\]"
        path_exempt:
          - src/estun_driver/estun_driver/estun_driver_node.py
    known_debt: []

  # 18. Jog stop-cause propagation (Lesson 165, 2026-08-04).
  - id: jog_stop_cause_propagation
    description: >
      When the driver stops a jog, the operator must see WHY within one
