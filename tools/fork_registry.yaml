  # 22. Unified event log (2026-08-05 operator directive).
  - id: event_log
    description: >
      ONE writer, ONE persistent forensic store. Every error, warning,
      or info the platform surfaces routes through
      `cobot_dashboard.event_log.emit(...)`. Records land as JSONL
      lines in /opt/cobot/event_log/events_YYYYMMDD.jsonl with daily
      UTC rotation, 90-day retention, and a size cap. Dismissing a
      toast NEVER deletes the record.

